# Development-only overlay: reuse the native repository data read-only while
# keeping the validation receipt, web jobs, state, uploads and results in
# isolated Docker volumes.
services:
  api:
    volumes:
      - type: bind
        source: ./databases
        target: /app/databases
        read_only: true
        bind:
          create_host_path: false

  validate-data:
    volumes:
      - type: bind
        source: ./databases
        target: /app/databases
        read_only: true
        bind:
          create_host_path: false
